[package]
name = "companion-platform"
description = "OS-specific input hook, foreground detection and synthetic input for Create Companion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
companion-core.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies]
auto-launch = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSDate", "NSGeometry", "NSObject", "NSValue", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSEvent", "NSApplication", "NSResponder", "NSGraphicsContext", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFRunLoop", "CFMachPort", "CFString", "CFDate", "CFDictionary"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "libc"] }
libc = "0.2"
dirs = "6"
