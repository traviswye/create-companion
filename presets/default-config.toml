# Naya Companion configuration
# Generated by tools/gen_presets.py -- edit freely; the engine reloads on save.
#
# transport:  which F-key the Tune/Touch firmware emits for each gesture.
#             Only keys listed here are intercepted; all other keys pass through.
# profiles:   per-application bindings, matched on the foreground executable
#             (Windows) or bundle id (macOS), optionally narrowed by a
#             window_title substring (websites). Unbound events fall back to
#             default_profile.
# accel:      none | light | medium | aggressive -- repeat count grows with dial speed.

schema_version = 1

[engine]
start_at_login = false
log_level = "info"

[transport]
TUNE_CW = { key = "F24" }
TUNE_CCW = { key = "F23" }
TUNE_PRESS = { key = "F22" }
TUNE_SWIPE_LEFT = { key = "F20" }
TUNE_SWIPE_RIGHT = { key = "F19" }
TUNE_SWIPE_UP = { key = "F18" }
TUNE_SWIPE_DOWN = { key = "F17" }
# Touch modules use a modifier namespace on the same keys, e.g.:
# LEFT_TOUCH_SWIPE_LEFT = { key = "F20", mods = "shift" }

[default_profile]
name = "Default"

[default_profile.bindings.TUNE_CW]
action = { type = "media", key = "volume_up" }
accel = "light"

[default_profile.bindings.TUNE_CCW]
action = { type = "media", key = "volume_down" }
accel = "light"

[default_profile.bindings.TUNE_PRESS]
action = { type = "media", key = "mute" }

[default_profile.bindings.TUNE_SWIPE_LEFT]
action = { type = "media", key = "previous_track" }

[default_profile.bindings.TUNE_SWIPE_RIGHT]
action = { type = "media", key = "next_track" }

[default_profile.bindings.TUNE_SWIPE_UP]
action = { type = "media", key = "play_pause" }

[default_profile.bindings.TUNE_SWIPE_DOWN]
action = { type = "keys", chord = "Win+Tab" }

[[profiles]]
name = "Browser"
match = { windows_exe = ["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "vivaldi.exe"], macos_bundle = ["com.google.Chrome", "com.microsoft.edgemac", "org.mozilla.firefox", "com.brave.Browser", "com.apple.Safari"] }

[profiles.bindings.TUNE_CW]
action = { type = "keys", chord = "Ctrl+Tab" }

[profiles.bindings.TUNE_CCW]
action = { type = "keys", chord = "Ctrl+Shift+Tab" }

[profiles.bindings.TUNE_PRESS]
action = { type = "keys", chord = "Ctrl+T" }

[profiles.bindings.TUNE_SWIPE_LEFT]
action = { type = "keys", chord = "Alt+Left" }

[profiles.bindings.TUNE_SWIPE_RIGHT]
action = { type = "keys", chord = "Alt+Right" }

[profiles.bindings.TUNE_SWIPE_UP]
action = { type = "keys", chord = "Ctrl+=" }

[profiles.bindings.TUNE_SWIPE_DOWN]
action = { type = "keys", chord = "Ctrl+-" }

