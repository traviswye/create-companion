# CI for Naya Companion.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Presets are up to date
        run: |
          python tools/gen_presets.py
          git diff --exit-code -- presets/ || (echo "::error::presets/ is stale; run tools/gen_presets.py" && exit 1)
        shell: bash
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
        # macOS platform code lands in Phase 5; until then the engine only builds on Windows.
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
      - run: cargo test --workspace
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
