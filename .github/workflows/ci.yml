# CI for Create Companion.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Presets are up to date
        run: |
          python tools/gen_presets.py
          git diff --exit-code -- presets/ || (echo "::error::presets/ is stale; run tools/gen_presets.py" && exit 1)
        shell: bash
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Configuration UI (Tauri): frontend first, then the Rust shell that embeds it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The UI bundles the engine as a sidecar; build the engine first and put
      # it where tauri-build expects it (binaries/<name>-<host triple>).
      - name: Engine sidecar for the UI build
        shell: bash
        run: |
          cargo build --release -p create-companion
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=.exe
          mkdir -p ui/src-tauri/binaries
          cp "target/release/create-companion$ext" "ui/src-tauri/binaries/create-companion-$triple$ext"
      - run: cargo build --release -p create-companion-ui --features create-companion-ui/custom-protocol
