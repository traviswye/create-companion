# Release: on a version tag, build the Windows installer and attach it to a
# GitHub Release. macOS joins in Phase 5.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import json;print(json.load(open('ui/src-tauri/tauri.conf.json'))['version'])")
          test "$tag" = "$ver" || (echo "::error::tag v$tag != tauri.conf.json version $ver" && exit 1)
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_installer.ps1
      # Code signing: add a step here once a certificate exists (Tauri reads
      # bundle.windows.certificateThumbprint, or sign the .exe with signtool).
      - uses: actions/upload-artifact@v4
        with:
          name: create-companion-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
      - name: Release notes for this version (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # The "## <ver> ..." section of CHANGELOG.md, up to the next "## " heading.
          awk -v v="$ver" '
            /^## / { if (on) exit; on = (index($0, "## " v) == 1) ; if (on) next }
            on { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then echo "::error::CHANGELOG.md has no section for $ver" && exit 1; fi
          printf '
---
Install instructions: https://github.com/%s/blob/%s/INSTALL.md
' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> RELEASE_BODY.md
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Create Companion ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
